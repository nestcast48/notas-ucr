<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de notas</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:transparent; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 14px; font-size:.9rem; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 200px; padding:10px 12px; font-size:1rem; border:1px solid #cbd5e1; border-radius:8px; text-transform:uppercase; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:10px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:12px; color:#b91c1c; min-height:1.2em; }
  #out { margin-top:8px; }
  .name { font-weight:700; font-size:1.05rem; margin:8px 0 10px; }
  .hero { margin-top:14px; border-radius:12px; padding:16px 18px; text-align:center; border:1px solid rgba(0,0,0,.08); }
  .hero .big { font-size:1.9rem; font-weight:800; letter-spacing:.2px; }
  .hero .cap { font-size:.85rem; margin-top:2px; color:#374151; }
  .bar { height:8px; background:var(--line); border-radius:99px; margin:14px 0 4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .barcap { font-size:.8rem; color:var(--muted); }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:.92rem; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  td.n, th.n { text-align:right; white-space:nowrap; }
  tr.grp td { background:#f3f4f6; font-weight:600; font-size:.8rem; color:#374151; }
  tr.pend td { color:#9ca3af; }
  .det { display:block; color:var(--muted); font-size:.8rem; }
  .chip { display:inline-block; min-width:64px; text-align:center; padding:2px 8px; border-radius:6px; font-weight:600; }
  .foot { margin-top:14px; font-size:.78rem; color:var(--muted); }
</style>
</head>

<div class="wrap">

  <p class="sub">Ingrese su carné institucional para ver su desglose.</p>
  <form id="f" autocomplete="off">
    <input id="carne" placeholder="Carné (ej. C1A234)" maxlength="20" required aria-label="Carné">
    <button id="go" type="submit">Consultar</button>
  </form>
  <div id="msg" role="alert"></div>
  <div id="out"></div>
</div>

const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
// Solo letras y números, sin distinguir mayúsculas/minúsculas ni espacios, guiones, etc.
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmt = x => x.toFixed(2);

// Escala de 3 colores de Excel (mínimo / mediana / máximo del grupo)
const RED = [248,105,107], YEL = [255,235,132], GRN = [99,190,123];
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function scale(v, lo, mid, hi) {
  if (hi <= lo) return css(YEL);
  if (v <= lo) return css(RED);
  if (v >= hi) return css(GRN);
  if (v < mid) return css(mix(RED, YEL, (v - lo) / ((mid - lo) || 1)));
  return css(mix(YEL, GRN, (v - mid) / ((hi - mid) || 1)));
}

async function lookup(carne) {
  const key = await crypto.subtle.importKey('raw', enc.encode(norm(carne)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iters, hash: 'SHA-256' }, key, 384));
  const id = hex(bits.slice(0, 16));
  const rec = DATA.students.find(s => s.id === id);
  if (!rec) return null;
  const aes = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.iv) }, aes, b64(rec.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function render(st) {
  const comps = DATA.components;
  const done = comps.filter(c => c.evaluated);
  const maxEval = done.reduce((a, c) => a + c.max, 0);
  const vals = st.v;
  const hasData = done.some(c => (vals[c.id] || 0) !== 0);
  let html = '';
  if (!hasData) {
    html += `<p>Aún no hay notas registradas para este carné.</p>`;
    return html;
  }
  const total = done.reduce((a, c) => a + (vals[c.id] || 0), 0);
  const diff = total - maxEval;
  const sc = DATA.scale;
  html += `<div class="hero" style="background:${scale(diff, sc.min, sc.mid, sc.max)}">
      <div class="big">${fmt(total)} de ${maxEval} (${fmt(diff)})</div>
      <div class="cap">Acumulado sobre el ${maxEval}% evaluado hasta el momento (entre paréntesis, puntos perdidos)</div>
    </div>
    <div class="bar"><i style="width:${maxEval}%"></i></div>
    <div class="barcap">${maxEval}% del curso evaluado · ${100 - maxEval}% pendiente</div>
    <table><thead><tr><th>Rubro</th><th class="n">Valor</th><th class="n">Obtenido</th></tr></thead><tbody>`;
  let lastGroup = null;
  for (const c of comps) {
    if (c.group !== lastGroup) { html += `<tr class="grp"><td colspan="3">${esc(c.group)}</td></tr>`; lastGroup = c.group; }
    const v = vals[c.id];
    if (!c.evaluated || v == null) {
      html += `<tr class="pend"><td>${esc(c.label)}</td><td class="n">${c.max}</td><td class="n">Pendiente</td></tr>`;
      continue;
    }
    const det = (st.det && st.det[c.id]) ? `<span class="det">${st.det[c.id].map((x, i) => `#${i + 1}: ${fmt(x)}`).join(' · ')}</span>` : '';
    html += `<tr><td>${esc(c.label)}${det}</td><td class="n">${c.max}</td>
      <td class="n"><span class="chip" style="background:${scale(v / c.max, 0, 0.5, 1)}">${fmt(v)}</span></td></tr>`;
  }
  html += `</tbody></table>
    <p class="foot">Información de carácter informativo. La nota oficial es la que se registra en el sistema institucional.${DATA.updated ? ' Actualizado: ' + esc(DATA.updated) + '.' : ''}</p>`;
  return html;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('title').textContent = DATA.title;
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'), out = document.getElementById('out'), btn = document.getElementById('go');
  msg.textContent = ''; out.innerHTML = ''; btn.disabled = true;
  try {
    const st = await lookup(document.getElementById('carne').value);
    if (!st) msg.textContent = 'No se encontró ese carné. Verifíquelo e intente de nuevo.';
    else out.innerHTML = render(st);
  } catch (err) {
    msg.textContent = 'No se pudo completar la consulta. Intente de nuevo.';
  } finally { btn.disabled = false; }
});
</script>
